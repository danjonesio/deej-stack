# Dependabot config for danjonesio/deej-stack. Written by /d-github on 2026-09-18.
#
# Deploy on merge: no, because the repo is a plugin (skills, hooks, manifests) and every deploy
# signal came back empty: no workflow deploy steps, host-config-files: none,
# host-words-in-docs: none, github-deployments: 0, github-environments: 0, looks-like-service: no.
#
# github-actions (/): version lane. .github/workflows/private-patterns.yml pins actions/checkout by
# full SHA, and a SHA pin never moves unless something watches it; nothing deploys when a workflow
# file merges. Two groups, so a bump month is one PR and an advisory wave is one PR.
# No commit-message prefix: conventional-prefixes-in-last-30 is 0 of 30.
#
# Not covered, on purpose:
#   - pre-commit (.pre-commit-config.yaml): its only hook is `repo: local`, which has no upstream
#     revision to bump. Add a `pre-commit` entry when a remote hook repo goes in.
#   - No other manifest or lockfile is in the tree (`git ls-files` against the d-github table).
#
# Branch protection: the default-branch ruleset requires a PR and, since 2026-09-18, the
# private-patterns check on an up-to-date branch (strict). Every open Dependabot PR therefore
# rebases after each merge, which is what the groups are for: one PR per wave, not one per action.
# Dependabot alerts and security updates were both off (vulnerability-alerts: off,
# automated-security-fixes: enabled=false) and were enabled in the same run.
#
# This file's own path is not a deploy trigger.

version: 2
updates:
  # Version lane: nothing deploys when a workflow file merges; SHA pins never move on their own.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions-versions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
