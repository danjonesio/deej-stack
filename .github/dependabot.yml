# Dependabot config for danjonesio/deej-stack. Written by /d-github on 2026-09-18.
#
# Deploy on merge: no, because the repo is a plugin (skills, hooks, manifests) and every deploy
# signal came back empty: no workflow deploy steps, host-config-files: none,
# host-words-in-docs: none, github-deployments: 0, github-environments: 0, looks-like-service: no.
#
# github-actions (/): version lane. A deviation from the standard, which wants one entry per
# ecosystem present: there are no workflows today (the private-patterns workflow was removed on
# 2026-09-18, when that check became local only). The entry stays so the first workflow added is
# watched from day one: a SHA-pinned action never moves unless something watches it, and nothing
# deploys when a workflow file merges. Two groups, so a bump month is one PR and an advisory wave
# is one PR.
# No commit-message prefix: conventional-prefixes-in-last-30 is 0 of 30.
#
# Not covered, on purpose:
#   - No other manifest or lockfile is in the tree (`git ls-files` against the d-github table).
#
# Branch protection: the default-branch ruleset requires a PR and no status checks, so there is
# no strict up-to-date rebase churn between Dependabot PRs.
# Dependabot alerts and security updates were both off (vulnerability-alerts: off,
# automated-security-fixes: enabled=false) and were enabled in the same run.
#
# This file's own path is not a deploy trigger.

version: 2
updates:
  # Version lane: nothing deploys when a workflow file merges; SHA pins never move on their own.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions-versions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
